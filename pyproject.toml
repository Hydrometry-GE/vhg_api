[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vhg-api"
version = "1.0.0"
description = "Configuration-driven client for the Tetraedre TDS JSON API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "requests>=2.31",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
vhg-api = "vhg_api.cli:main"

[tool.setuptools.packages.find]
include = ["vhg_api*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
